name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/fundraising_buddy/static
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run fundraising-buddy validate-public
      - run: uv run python3 tools/install_skills.py
      - run: uv run python3 tools/install_skills.py --check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: uv run python tools/smoke_release.py
