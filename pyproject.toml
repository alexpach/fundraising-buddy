[project]
name = "fundraising-buddy"
version = "0.1.0"
description = "An open investor directory and a private, agent-maintained fundraising wiki."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0.2,<7", "Markdown>=3.7,<4", "bleach>=6.2,<7"]

[project.scripts]
fundraising-buddy = "fundraising_buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundraising_buddy"]

